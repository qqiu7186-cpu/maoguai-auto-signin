name: 毛怪俱乐部签到

on:
  schedule:
    # 00:05 UTC = 08:05 Asia/Shanghai
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maoguai-sign-in
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAOGUAI_ACCOUNT: ${{ secrets.MAOGUAI_ACCOUNT }}
      MAOGUAI_PASSWORD: ${{ secrets.MAOGUAI_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check secrets
        run: |
          test -n "$MAOGUAI_ACCOUNT"
          test -n "$MAOGUAI_PASSWORD"
      - name: Run sign-in
        run: python main.py
