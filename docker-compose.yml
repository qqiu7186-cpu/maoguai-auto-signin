services:
  maoguai-sign:
    build: .
    image: maoguai-sign:local
    user: "${MAOGUAI_UID:-10001}:${MAOGUAI_GID:-10001}"
    environment:
      MAOGUAI_ACCOUNT: ${MAOGUAI_ACCOUNT:?Set MAOGUAI_ACCOUNT in .env or the shell}
      MAOGUAI_PASSWORD: ${MAOGUAI_PASSWORD:?Set MAOGUAI_PASSWORD in .env or the shell}
      MAOGUAI_BASE_URL: ${MAOGUAI_BASE_URL:-https://2550505.com}
      MAOGUAI_ALLOW_CUSTOM_BASE_URL: ${MAOGUAI_ALLOW_CUSTOM_BASE_URL:-false}
      MAOGUAI_CLIENT_VERSION: ${MAOGUAI_CLIENT_VERSION:-0c1c05}
      MAOGUAI_SESSION_FILE: ${MAOGUAI_SESSION_FILE:-/data/session.cookies}
      MAOGUAI_TIMEOUT: ${MAOGUAI_TIMEOUT:-30}
      MAOGUAI_RETRIES: ${MAOGUAI_RETRIES:-2}
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    restart: "no"
